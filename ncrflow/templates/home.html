{% extends "base.html" %}
{% block content %}
<section class="hero">
  <p class="eyebrow">Non-conformance reporting</p>
  <h1>Keep quality moving.</h1>
  <p class="lede">A shared place for your team to follow up on non-conformances.</p>
  {% if request.user.is_authenticated %}
    <a class="button" href="{% url 'tenants:workspace' %}">Open your workspace →</a>
  {% else %}
    <a class="button" href="{% url 'accounts:login' %}">Sign in to your company →</a>
  {% endif %}
</section>
{% endblock %}
